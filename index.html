<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الكلب يرمي طيور</title>
    <link rel="stylesheet" href="style.css?v=100">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-container">
        <!-- شاشة البداية -->
        <div id="start-screen" class="screen">
            <div class="menu-box">
                <h1 class="game-title">الكلب<br><span class="orange">يرمي</span><br><span class="green">طيور</span></h1>
                <div class="menu-options">
                    <button id="start-btn">▶ ابدأ اللعبة</button>
                </div>
            </div>
        </div>

        <!-- شاشة اللعب -->
        <div id="play-screen" class="screen hidden">
            <div class="hud-box score-box">
                <div class="hud-title">النتيجة</div>
                <div id="score-val">000000</div>
            </div>

            <div class="hud-box level-box">
                <div class="hud-title">المستوى</div>
                <div id="level-val">01 / 05</div>
            </div>

            <div id="sky-area"></div>

            <!-- رسمة الشجر والأرض بالبيكسل -->
            <div class="pixel-tree"></div>
            <div class="pixel-ground"></div>

            <!-- الكلب الضاحك رسم SVG -->
            <div id="dog" class="dog-hidden">
                <svg width="70" height="70" viewBox="0 0 100 100">
                    <path d="M 30,50 L 30,30 L 40,20 L 60,20 L 70,30 L 70,50 Z" fill="#8B4513"/>
                    <circle cx="50" cy="50" r="30" fill="#CD853F"/>
                    <circle cx="40" cy="45" r="5" fill="#000"/>
                    <circle cx="60" cy="45" r="5" fill="#000"/>
                    <ellipse cx="50" cy="58" rx="8" ry="6" fill="#000"/>
                    <path d="M 45,65 Q 50,75 55,65" fill="pink" stroke="#000" stroke-width="2"/>
                    <path d="M 20,30 Q 10,50 25,60" fill="#4A2511"/>
                    <path d="M 80,30 Q 90,50 75,60" fill="#4A2511"/>
                </svg>
            </div>

            <div id="crosshair"></div>

            <!-- السلاح رسم SVG -->
            <div id="shotgun">
                <svg width="60" height="120" viewBox="0 0 60 120">
                    <rect x="25" y="0" width="10" height="80" fill="#333" stroke="#000" stroke-width="2"/>
                    <rect x="20" y="60" width="20" height="60" rx="5" fill="#8B4513" stroke="#000" stroke-width="2"/>
                </svg>
            </div>

            <button id="exit-btn">خروج</button>
        </div>
    </div>

    <script src="game.js?v=100"></script>
</body>
</html>

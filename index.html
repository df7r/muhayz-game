<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكلب يرمي طيور</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-container">
        <!-- شاشة البداية / القائمة -->
        <div id="start-screen" class="screen">
            <div class="menu-box">
                <h1 class="game-title">الكلب<br><span class="orange">يرمي</span><br><span class="green">طيور</span></h1>
                <div class="menu-options">
                    <button id="start-btn">▶ ابدأ اللعبة</button>
                    <button onclick="alert('صوّب واضغط على الطيور لإسقاطها قبل ما تهرب!')">تعليمات</button>
                    <button onclick="alert('أفضل نتيجة: ' + (localStorage.getItem('highscore') || 0))">أفضل النتائج</button>
                </div>
            </div>
            <div class="dog-intro"></div>
            <div class="ground-intro"></div>
            <div class="footer-copy">© 2026</div>
        </div>

        <!-- شاشة اللعب الحقيقية -->
        <div id="play-screen" class="screen hidden">
            <!-- الهيدر والمعلومات -->
            <div class="hud-box score-box">
                <div class="hud-title">النتيجة</div>
                <div id="score-val">000000</div>
                <div class="bullets-icon">
                    <span class="b"></span><span class="b"></span><span class="b"></span>
                </div>
            </div>

            <div class="hud-box level-box">
                <div class="hud-title">المستوى</div>
                <div id="level-val">01 / 05</div>
            </div>

            <!-- منطقة السماء والطيور -->
            <div id="sky-area"></div>

            <!-- الكلب -->
            <div id="dog" class="dog-hidden">
                <div id="dog-bubble" class="hidden">هاهاها!<br>ما أصبت!</div>
            </div>

            <!-- البندقية والشعبات تحت -->
            <div id="crosshair"></div>
            <div id="shotgun"></div>

            <div class="ground-play"></div>
            <div class="trees-bg"></div>

            <button id="exit-btn">خروج<br><small>ESC</small></button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
